<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1F17">
<title>Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* ============================================================
   tokens — design system "Serge Finance · sistema"
   dark is the primary theme; light follows the OS preference
   ============================================================ */
:root {
  /* surfaces */
  --bg-0: #0B1F17; --bg-1: #12291F; --bg-2: #183626;
  /* ink (bone) */
  --ink-1: #E9E2D0; --ink-2: #C9C0A9; --ink-3: #9C947E; --on-ink: #0B1F17;
  /* hairlines */
  --hair: rgba(233,226,208,.12); --hair-strong: rgba(233,226,208,.24);
  /* accents */
  --sage: #6F8F6A; --sage-ink: #8FA98A;
  --ox: #7A2E2E; --ox-ink: #C47A72;
  --scrim: rgba(4,12,9,.72);
  /* type */
  --f-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --f-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --track-label: .14em;
  /* space, radii, motion */
  --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px;
  --r-1: 4px; --r-2: 6px;
  --ease: cubic-bezier(.4,0,.2,1); --dur: 160ms;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg-0: #F2EDE1; --bg-1: #EBE5D6; --bg-2: #E2DBC9;
    --ink-1: #0B1F17; --ink-2: #3A4F44; --ink-3: #5C6B61; --on-ink: #F2EDE1;
    --hair: rgba(11,31,23,.12); --hair-strong: rgba(11,31,23,.26);
    --sage-ink: #4A6B46; --ox-ink: #7A2E2E;
    --scrim: rgba(11,31,23,.5);
  }
}

/* ============================================================
   base
   ============================================================ */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg-0); color: var(--ink-1);
  font-family: var(--f-sans); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; color: inherit; }
input, select, textarea { font: inherit; color: var(--ink-1); }
a { color: var(--ink-1); text-decoration: none; }
h1, h2, h3 { margin: 0; font-weight: 400; }

.serif { font-family: var(--f-serif); }
.lbl {
  font-size: 11px; font-weight: 500; letter-spacing: var(--track-label);
  text-transform: uppercase; color: var(--ink-3); line-height: 1;
}
.tn { font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1; }
.b2 { color: var(--ink-2); } .b3 { color: var(--ink-3); }
.sage { color: var(--sage-ink); } .ox { color: var(--ox-ink); }
.hr { height: 1px; background: var(--hair); flex-shrink: 0; }

/* money — serif, tabular; symbol and decimals at 60% in secondary ink */
.money {
  font-family: var(--f-serif); font-variant-numeric: tabular-nums lining-nums;
  font-feature-settings: "tnum" 1, "lnum" 1;
  color: var(--ink-1); font-weight: 400; line-height: 1; white-space: nowrap;
}
.money .c { font-size: .6em; color: var(--ink-2); margin-right: .05em; }
.money .d { font-size: .6em; color: var(--ink-2); }
.money.in { color: var(--sage-ink); }
.money.in .c, .money.in .d { color: var(--sage-ink); opacity: .85; }
.money.ox { color: var(--ox-ink); }
.money.ox .c, .money.ox .d { color: var(--ox-ink); opacity: .85; }
/* income is blurred until tapped — someone glancing at the screen
   should not read the salary */
.money.oculto { filter: blur(.28em); cursor: pointer; user-select: none; transition: filter var(--dur) var(--ease); }
.money.oculto.ver { filter: none; }

/* progress bar — 2px, oxblood past 100%, sage for goals */
.bar { height: 2px; background: var(--hair); flex-shrink: 0; }
.bar i { display: block; height: 100%; background: var(--ink-1); transition: width var(--dur) var(--ease); }
.bar.over i { background: var(--ox); }
.bar.sage i { background: var(--sage); }

.card { background: var(--bg-1); border: 1px solid var(--hair); border-radius: var(--r-2); }

/* buttons */
.btn {
  font-family: var(--f-sans); font-size: 13px; font-weight: 500; letter-spacing: .06em;
  text-transform: uppercase; height: 44px; padding: 0 20px; border-radius: var(--r-1);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity var(--dur) var(--ease); border: 1px solid transparent;
}
.btn[disabled] { opacity: .45; }
.btn-p { background: var(--ink-1); color: var(--on-ink); border-color: var(--ink-1); }
.btn-s { background: transparent; color: var(--ink-1); border-color: var(--hair-strong); }
.btn-d { background: transparent; color: var(--ox-ink); padding: 0 8px; }
.btn-w { width: 100%; }

/* chips — fill with bone in 160ms, like a stamp */
.chip {
  font-family: var(--f-sans); font-size: 12px; letter-spacing: .02em; color: var(--ink-2);
  border: 1px solid var(--hair-strong); border-radius: var(--r-1); height: 44px;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  background: transparent; padding: 0 8px; text-align: center; line-height: 1.15;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.chip.on { background: var(--ink-1); color: var(--on-ink); border-color: var(--ink-1); }
.chip.sm { height: 36px; padding: 0 12px; }
.chip .ico { width: 15px; height: 15px; }
.chip-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); }
.chip-row { display: flex; gap: var(--s-2); }
.chip-row .chip { flex-grow: 1; padding: 0 6px; }

/* inputs — underlined, never a box */
.inp {
  font-family: var(--f-sans); font-size: 15px; color: var(--ink-1); background: transparent;
  border: 0; border-bottom: 1px solid var(--hair-strong); padding: 10px 0; width: 100%;
  outline: none; border-radius: 0;
}
.inp::placeholder { color: var(--ink-3); }
.inp:focus { border-bottom-color: var(--ink-1); }
select.inp { -webkit-appearance: none; appearance: none; }
.campo { display: flex; flex-direction: column; gap: 2px; }

/* icons */
.ico {
  width: 20px; height: 20px; stroke: currentColor; fill: none;
  stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
}
.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.dot.open { background: var(--sage); } .dot.closed { background: var(--ox); }
.disc { width: 6px; height: 6px; flex-shrink: 0; opacity: .7; }

/* tables (Mac) */
table { border-collapse: collapse; width: 100%; }
th {
  font-family: var(--f-sans); font-size: 11px; font-weight: 500;
  letter-spacing: var(--track-label); text-transform: uppercase; color: var(--ink-3);
  text-align: left; padding: 0 12px 12px 0; border-bottom: 1px solid var(--hair-strong);
}
td {
  font-family: var(--f-sans); font-size: 14px; color: var(--ink-1);
  padding: 13px 12px 13px 0; border-bottom: 1px solid var(--hair); vertical-align: middle;
}
th.r, td.r { text-align: right; padding-right: 0; }

/* ledger row */
.fila {
  display: flex; align-items: center; gap: var(--s-3);
  padding: 12px 0; border-bottom: 1px solid var(--hair);
}
.fila .ico-cat { color: var(--ink-3); }
.fila .quien { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.fila .titulo { font-size: 15px; color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fila .sub { font-size: 12px; color: var(--ink-3); }
.fila .aviso { font-size: 12px; color: var(--ox-ink); }

.vacio { padding: 48px 0; text-align: center; }
.vacio .serif { font-size: 20px; display: block; margin-bottom: 6px; }
.err { color: var(--ox-ink); font-size: 13px; min-height: 1.1em; }
.stamp { animation: stamp .18s var(--ease); }
@keyframes stamp { from { transform: scale(1.02); opacity: .6 } to { transform: scale(1); opacity: 1 } }

/* ============================================================
   auth
   ============================================================ */
#pantalla-auth { max-width: 380px; margin: 0 auto; padding: 18vh var(--s-5) 0; }
#pantalla-auth .marca { font-size: 26px; margin-bottom: 4px; }
#pantalla-auth form { display: flex; flex-direction: column; gap: var(--s-5); margin-top: var(--s-8); }

/* ============================================================
   shell — phone tabs / Mac sidebar
   ============================================================ */
#app { display: flex; min-height: 100vh; }
#lateral { display: none; }
#cuerpo { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; }
main { flex-grow: 1; min-width: 0; padding: calc(env(safe-area-inset-top) + 40px) var(--s-5) var(--s-5); }
main > section { display: flex; flex-direction: column; gap: var(--s-5); }

.enc { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); }
.enc h1 { font-family: var(--f-serif); font-size: 28px; }

nav.tabs {
  position: sticky; bottom: 0; z-index: 10;
  height: 76px; border-top: 1px solid var(--hair); background: var(--bg-0);
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: 2px 8px calc(10px + env(safe-area-inset-bottom));
}
nav.tabs a {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); padding: 8px 0; position: relative;
}
nav.tabs a.on { color: var(--ink-1); }
nav.tabs .badge {
  position: absolute; top: 4px; left: 50%; margin-left: 6px;
  background: var(--ox); color: #fff; border-radius: 9px;
  font-size: 9px; padding: 1px 5px; font-weight: 500; letter-spacing: 0;
}

/* ============================================================
   screens
   ============================================================ */
.hoy-estado { display: flex; flex-direction: column; gap: 10px; }
.hoy-estado .titulo { display: flex; align-items: center; gap: var(--s-3); }
.hoy-estado h1 { font-family: var(--f-serif); font-size: 30px; letter-spacing: -.005em; }
.hoy-estado .ico { width: 26px; height: 26px; }
.hoy-sub { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: var(--s-2); }
.hoy-disc { display: flex; flex-direction: column; gap: var(--s-3); }
.hoy-disc .money { font-size: 60px; }
.dos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); }
.dos > div { display: flex; flex-direction: column; gap: var(--s-2); padding: 14px 0; border-top: 1px solid var(--hair); }
.dos .money { font-size: 24px; }

.pres-fila { display: flex; flex-direction: column; gap: 7px; padding: 9px 0; }
.pres-fila .top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); }
.pres-fila .nom { font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.pres-fila .cifra { font-family: var(--f-serif); font-size: 15px; }
.pres-fila .cifra small { color: var(--ink-3); font-size: 13px; }
.pres-fila .pie { display: flex; justify-content: flex-end; font-size: 12px; color: var(--ink-3); }

.saldo-fila {
  display: flex; justify-content: space-between; align-items: center; gap: var(--s-3);
  padding: 13px 0; border-top: 1px solid var(--hair);
}
.saldo-fila .money { font-size: 17px; }

.meta-card { padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-3); }
.meta-card .top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-2); }
.meta-card .top .serif { font-size: 18px; }
.meta-card .pie { display: flex; justify-content: space-between; align-items: baseline; }
.meta-card .money { font-size: 20px; }

.menu-fila {
  display: flex; align-items: center; gap: var(--s-3);
  padding: 16px 0; border-bottom: 1px solid var(--hair); width: 100%;
  background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left;
}
.menu-fila span { flex-grow: 1; font-size: 15px; }
.menu-fila .ico:last-child { color: var(--ink-3); }

.chk-fila { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--hair); }
.chk-fila .quien { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
.chk-fila .cuenta { font-size: 24px; min-width: 56px; text-align: center; }
.chk-fila .btn { width: 44px; padding: 0; }
.hist { display: flex; justify-content: space-between; padding: 4px 0; }
.hist div { display: flex; flex-direction: column; align-items: center; gap: var(--s-2); }
.hist .dot { width: 8px; height: 8px; }
.hist span { font-size: 9px; color: var(--ink-3); white-space: nowrap; }
.regla { font-size: 14px; line-height: 1.55; color: var(--ink-2); }
.regla b { color: var(--ink-1); font-weight: 400; }

.totales { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-6); }
.totales > div { display: flex; flex-direction: column; gap: var(--s-3); padding: 20px 0 0; border-top: 1px solid var(--hair-strong); }
.totales .money { font-size: 28px; }

.filtros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3) var(--s-4); }
.solo-mac { display: none; }
.pie-tabla { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-4); padding-top: var(--s-2); }

/* ============================================================
   sheets + toast
   ============================================================ */
.sheet[hidden] { display: none; }
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; }
.sheet .scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet .panel {
  position: relative; width: 100%; background: var(--bg-1);
  border-top: 1px solid var(--hair-strong); border-radius: var(--r-2) var(--r-2) 0 0;
  padding: var(--s-3) var(--s-5) calc(28px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 18px;
  max-height: 92vh; overflow-y: auto;
}
.sheet .asa { width: 36px; height: 2px; background: var(--hair-strong); border-radius: 1px; margin: 0 auto; }
.tabs-hoja { display: flex; gap: var(--s-6); border-bottom: 1px solid var(--hair); }
.tabs-hoja button {
  background: none; border: 0; padding: 8px 0 12px; margin-bottom: -1px;
  font-size: 11px; font-weight: 500; letter-spacing: var(--track-label);
  text-transform: uppercase; color: var(--ink-3);
}
.tabs-hoja button.on { color: var(--ink-1); border-bottom: 1px solid var(--ink-1); }
.monto-grande {
  width: 100%; border: 0; background: none; text-align: center; outline: none;
  font-family: var(--f-serif); font-size: 56px; color: var(--ink-1);
  font-variant-numeric: tabular-nums lining-nums; padding: 8px 0 4px;
}
.monto-grande::placeholder { color: var(--ink-3); }

#toast[hidden] { display: none; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 40;
  bottom: calc(96px + env(safe-area-inset-bottom));
  display: inline-flex; align-items: center; gap: var(--s-3);
  background: var(--bg-2); border: 1px solid var(--hair-strong); border-radius: var(--r-1);
  padding: 12px 16px; font-size: 13px; color: var(--ink-1); max-width: calc(100vw - 40px);
}
#toast button { background: none; border: 0; color: var(--ink-2); text-decoration: underline; padding: 0; }

/* ============================================================
   wide (Mac) layout
   ============================================================ */
@media (min-width: 860px) {
  nav.tabs { display: none; }
  #lateral {
    display: flex; flex-direction: column; gap: 28px; flex-shrink: 0;
    width: 240px; border-right: 1px solid var(--hair); padding: 40px var(--s-5) 28px;
    position: sticky; top: 0; height: 100vh;
  }
  #lateral .marca { padding: 0 12px; display: flex; flex-direction: column; gap: 14px; }
  #lateral .marca .serif { font-size: 22px; }
  #lateral .secciones { display: flex; flex-direction: column; gap: 4px; }
  #lateral .secciones a {
    display: flex; align-items: center; gap: 12px; font-size: 13px; letter-spacing: .04em;
    color: var(--ink-2); padding: 10px 12px; border-radius: var(--r-1); height: 44px;
    border: 1px solid transparent;
  }
  #lateral .secciones a.on { color: var(--ink-1); background: var(--bg-1); border-color: var(--hair); }
  #lateral .pie { padding: 0 12px; display: flex; flex-direction: column; gap: 12px; font-size: 12px; color: var(--ink-2); }
  #lateral .crece { flex-grow: 1; }

  main { padding: 44px 56px 40px; max-width: 1180px; }
  main > section { gap: 28px; }
  .enc h1 { font-size: 40px; letter-spacing: -.005em; }
  .totales { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px; }
  .totales .money { font-size: 34px; }
  .dos { gap: 40px; }
  .filtros { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .solo-mac { display: revert; }
  .solo-movil { display: none; }
  .sheet { align-items: center; justify-content: center; }
  .sheet .panel { max-width: 460px; border-radius: var(--r-2); border: 1px solid var(--hair-strong); padding-bottom: 28px; }
  #toast { bottom: 28px; }
  .mac-2col { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 56px; }
}
</style>
</head>
<body>

<!-- ============ auth ============ -->
<section id="pantalla-auth" hidden>
  <div class="serif marca">Finance</div>
  <span class="lbl">Entrar</span>
  <form id="form-login">
    <label class="campo"><span class="lbl">Correo</span>
      <input class="inp" type="email" id="login-email" autocomplete="username" required></label>
    <label class="campo"><span class="lbl">Contraseña</span>
      <input class="inp" type="password" id="login-pass" autocomplete="current-password" required></label>
    <div class="err" id="login-error"></div>
    <button class="btn btn-p btn-w" type="submit">Entrar</button>
  </form>
</section>

<!-- ============ app ============ -->
<div id="app" hidden>
  <aside id="lateral">
    <div class="marca">
      <div class="serif">Finance</div>
      <div class="hr"></div>
    </div>
    <nav class="secciones" aria-label="Secciones">
      <a href="#/resumen" data-ruta="resumen"><span data-icon="grafica"></span>Resumen</a>
      <a href="#/movimientos" data-ruta="movimientos"><span data-icon="lista"></span>Movimientos</a>
      <a href="#/presupuestos" data-ruta="presupuestos"><span data-icon="sobres"></span>Presupuestos</a>
      <a href="#/inbox" data-ruta="inbox"><span data-icon="inbox"></span>Inbox</a>
      <a href="#/candado" data-ruta="candado"><span data-icon="candado-abierto"></span>Candado</a>
    </nav>
    <div class="crece"></div>
    <div class="pie">
      <div class="hr"></div>
      <div id="lateral-estado" style="display:flex;align-items:center;gap:10px"></div>
      <button class="btn btn-s" id="btn-hoja-mac">Gasto rápido</button>
      <button class="btn btn-d" id="btn-salir" style="justify-content:flex-start">Salir</button>
    </div>
  </aside>

  <div id="cuerpo">
    <main>
      <section id="pantalla-hoy" hidden></section>
      <section id="pantalla-inbox" hidden></section>
      <section id="pantalla-mes" hidden></section>
      <section id="pantalla-mas" hidden></section>
      <section id="pantalla-candado" hidden></section>
      <section id="pantalla-resumen" hidden></section>
      <section id="pantalla-movimientos" hidden></section>
      <section id="pantalla-presupuestos" hidden></section>
    </main>

    <nav class="tabs" aria-label="Navegación">
      <a href="#/hoy" data-ruta="hoy"><span data-icon="reloj"></span>Hoy</a>
      <a href="#/inbox" data-ruta="inbox"><span data-icon="inbox"></span>Inbox<span class="badge" id="inbox-badge" hidden></span></a>
      <a href="#/mes" data-ruta="mes"><span data-icon="calendario"></span>Mes</a>
      <a href="#/mas" data-ruta="mas"><span data-icon="puntos"></span>Más</a>
    </nav>
  </div>
</div>

<!-- ============ quick add sheet ============ -->
<div id="hoja" class="sheet" hidden>
  <div class="scrim" data-cerrar></div>
  <section class="panel" aria-label="Gasto rápido">
    <div class="asa"></div>
    <div class="tabs-hoja">
      <button type="button" data-tipo="gasto">Gasto</button>
      <button type="button" data-tipo="ingreso">Ingreso</button>
      <button type="button" data-tipo="ahorro">Meta</button>
    </div>
    <div>
      <input class="monto-grande" id="hoja-monto" type="text" inputmode="decimal" placeholder="$0.00" autocomplete="off">
      <div class="tn" id="hoja-pie" style="text-align:center;font-size:12px;color:var(--ink-3);letter-spacing:.04em"></div>
    </div>
    <label class="campo"><span class="lbl">Nota</span>
      <input class="inp" id="hoja-nota" type="text" autocomplete="off"></label>
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="lbl" id="hoja-lbl-cat">Categoría</span>
      <div class="chip-grid" id="hoja-cats"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="lbl">Cuenta</span>

function icon(name, size = 20) {
  return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.help}</svg>`;
}
/* the small ring that marks a discretionary category */
const DISC = '<svg class="ico disc" width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="3" stroke-width="1"/></svg>';

/* ============ fmt: money, dates, ISO weeks ============ */
const fmt = {
  _mxn: new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }),
  mxn(n) { return this._mxn.format(Number(n) || 0); },

  /* design money markup: symbol and decimals at 60%, optional explicit sign.
     Income (clase 'in') renders blurred until tapped. */
  money(n, { signo = false, clase = '', decimales = true } = {}) {
    const v = Number(n) || 0;
    const [ent, dec] = Math.abs(v).toFixed(2).split('.');
    const miles = Number(ent).toLocaleString('es-MX');
    const sig = signo ? (v < 0 ? '−' : '+') : '';
    const privado = clase.includes('in');
    return `<span class="money ${clase}${privado ? ' oculto' : ''}"` +
           (privado ? ' title="Toca para ver" aria-label="Ingreso oculto, toca para ver"' : '') +
           `>${sig}<span class="c">$</span>${miles}` +
           (decimales ? `<span class="d">.${dec}</span>` : '') + '</span>';
  },

  hoy() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chihuahua' }).format(new Date()); },
  hoyDate() { return new Date(this.hoy() + 'T12:00:00Z'); },
  fecha(iso) {
    return new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'short', timeZone: 'UTC' })
      .format(new Date(iso + 'T12:00:00Z'));
  },
  fechaLarga(d) {
    return new Intl.DateTimeFormat('es-MX', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }).format(d);
  },
  mes() { return this.hoy().slice(0, 7); },
  mesAnterior(ym = this.mes()) {
    const [y, m] = ym.split('-').map(Number);
    return new Date(Date.UTC(y, m - 2, 15)).toISOString().slice(0, 7);
  },
  nombreMes(ym) {
    const [y, m] = ym.split('-').map(Number);
    return new Intl.DateTimeFormat('es-MX', { month: 'long', timeZone: 'UTC' }).format(new Date(Date.UTC(y, m - 1, 15)));
  },
  diasRestantesMes() {
    const d = this.hoyDate();
    return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate() - d.getUTCDate();
  },

  /* ISO week, same shape as Postgres to_char(d, 'IYYY-"W"IW') */
  semanaISO(d = this.hoyDate()) {
    const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3); // Thursday of this week
    const jan4 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    const semana = 1 + Math.round(((t - jan4) / 864e5 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
    return `${t.getUTCFullYear()}-W${String(semana).padStart(2, '0')}`;
  },
  lunesDe(d = this.hoyDate()) {
    const t = new Date(d);
    t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7));
    return t;
  },
  semanaHace(n) { // ISO week label n weeks ago
    const d = this.hoyDate();
    d.setUTCDate(d.getUTCDate() - 7 * n);
    return this.semanaISO(d);
  },
  rangoSemana(d = this.hoyDate()) {
    const l = this.lunesDe(d), dom = new Date(l);
    dom.setUTCDate(dom.getUTCDate() + 6);
    const f = x => new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'short', timeZone: 'UTC' }).format(x);
    return `${f(l).replace(/\s.*/, '')}–${f(dom)}`;
  },
};

/* ============ api: the only code that talks to Supabase ============ */
const api = {
  session: null,

  loadSession() {
    try { this.session = JSON.parse(localStorage.getItem('sf_session')); } catch { this.session = null; }
  },
  saveSession(s) {
    this.session = s;
    try {
      if (s) localStorage.setItem('sf_session', JSON.stringify(s));
      else localStorage.removeItem('sf_session');
    } catch {}
  },

  async _auth(path, body) {
    const r = await fetch(`${CONFIG.url}/auth/v1/${path}`, {
      method: 'POST',
      headers: { apikey: CONFIG.key, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error_description || data.msg || 'Error de autenticación');
    return data;
  },

  async signIn(email, password) {
    const d = await this._auth('token?grant_type=password', { email, password });
    this.saveSession({ access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at });
  },
  signOut() { this.saveSession(null); },

  async _token() {
    if (!this.session) throw new Error('Sin sesión');
    if (this.session.expires_at * 1000 < Date.now() + 60000) {
      const d = await this._auth('token?grant_type=refresh_token', { refresh_token: this.session.refresh_token });
      this.saveSession({ access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at });
    }
    return this.session.access_token;
  },

  async _rest(method, path, body, headers = {}) {
    const token = await this._token();
    const r = await fetch(`${CONFIG.url}/rest/v1/${path}`, {
      method,
      headers: {
        apikey: CONFIG.key,
        Authorization: `Bearer ${token}`,
        'Content-Type': 'application/json',
        Prefer: method === 'GET' ? '' : 'return=representation',
        ...headers,
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) throw new Error(`Supabase ${r.status}: ${await r.text()}`);
    return r.status === 204 ? null : r.json();
  },

  /* catalogs */
  listCategorias() { return this._rest('GET', 'categorias?select=*&order=orden'); },
  listCuentas()    { return this._rest('GET', 'cuentas?select=*&activa=eq.true&order=creado'); },

  /* ledger */
  listInbox() {
    return this._rest('GET', 'movimientos?select=*&categoria_id=is.null&tipo=in.(gasto,ingreso)&order=creado.desc');
  },
  listMovimientos(filtros = {}, limit = 200) {
    let q = `movimientos?select=*,categorias(nombre,icono,discrecional),cuentas(nombre)` +
            `&or=(categoria_id.not.is.null,tipo.in.(ahorro,ajuste))&order=fecha.desc,creado.desc&limit=${limit}`;
    if (filtros.mes) {
      const [y, m] = filtros.mes.split('-').map(Number);
      q += `&fecha=gte.${filtros.mes}-01&fecha=lt.${new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 10)}`;
    }
    if (filtros.cuenta_id) q += `&cuenta_id=eq.${filtros.cuenta_id}`;
    if (filtros.categoria_id) q += `&categoria_id=eq.${filtros.categoria_id}`;
    return this._rest('GET', q);
  },
  listMovsMes(mes) {
    const [y, m] = mes.split('-').map(Number);
    const fin = new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 10);
    return this._rest('GET',
      `movimientos?select=monto,fecha,categoria_id,tipo&fecha=gte.${mes}-01&fecha=lt.${fin}`);
  },
  listRecientes(limit = 5) {
    return this._rest('GET',
      `movimientos?select=*,categorias(nombre,icono,discrecional),cuentas(nombre)&order=fecha.desc,creado.desc&limit=${limit}`);
  },
  addMovimiento(mov)            { return this._rest('POST', 'movimientos', mov); },
  actualizarMovimiento(id, campos) { return this._rest('PATCH', `movimientos?id=eq.${id}`, campos); },
  borrarMovimiento(id)          { return this._rest('DELETE', `movimientos?id=eq.${id}`); },

  /* aggregates */
  getEstado()         { return this._rest('GET', 'estado?select=*').then(r => r[0] || null); },
  listSaldos()        { return this._rest('GET', 'saldos?select=*'); },
  listMetasProgreso() { return this._rest('GET', 'metas_progreso?select=*'); },
  listGastoMensual()  { return this._rest('GET', 'gasto_mensual_categoria?select=*'); },

  /* budgets */
  listPresupuestos(mes) { return this._rest('GET', `presupuestos?select=*&mes=eq.${mes}`); },
  addPresupuestos(rows) { return this._rest('POST', 'presupuestos', rows); },
  upsertPresupuesto(mes, categoria_id, limite) {
    return this._rest('POST', 'presupuestos?on_conflict=user_id,mes,categoria_id',
      { mes, categoria_id, limite },
      { Prefer: 'resolution=merge-duplicates,return=representation' });
  },

  /* goals */
  addMeta(nombre, objetivo) { return this._rest('POST', 'metas', { nombre, objetivo }); },

  /* lock */
  listSemanaMetas()    { return this._rest('GET', 'semana_metas?select=*&activa=eq.true&order=creado'); },
  listSemanaRegistro() { return this._rest('GET', 'semana_registro?select=*'); },
  setSemanaRegistro(semana, semana_meta_id, veces) {
    return this._rest('POST', 'semana_registro?on_conflict=user_id,semana,semana_meta_id',
      { semana, semana_meta_id, veces },
      { Prefer: 'resolution=merge-duplicates,return=representation' });
  },
  addSemanaMeta(nombre, veces_objetivo) { return this._rest('POST', 'semana_metas', { nombre, veces_objetivo }); },
  archivarSemanaMeta(id) { return this._rest('PATCH', `semana_metas?id=eq.${id}`, { activa: false }); },
  setUmbral(umbral_candado) {
    return this._rest('PATCH', 'config?umbral_candado=gte.0', { umbral_candado });
  },
};

/* ============ store: single in-memory state ============ */
const store = {
  categorias: [], cuentas: [],
  inbox: [], movimientos: [], recientes: [], movsMes: [],
  saldos: [], metasP: [], presupuestos: [], gastoMensual: [],
  estado: null, semanaMetas: [], semanaRegistro: [],
  notaCopiado: null,
  inboxAbierto: null,          // id of the expanded inbox card
  filtros: { mes: '', cuenta_id: '', categoria_id: '', q: '' },
  presEdit: {},                // pending budget edits {categoria_id: limite}
  add: { tipo: 'gasto', categoria_id: null, cuenta_id: null, meta_id: null },

  async cargarCatalogos() {
    [this.categorias, this.cuentas] = await Promise.all([api.listCategorias(), api.listCuentas()]);
    if (!this.add.cuenta_id) this.add.cuenta_id = this.cuentas[0]?.id ?? null;
  },
  async cargarInbox() { this.inbox = await api.listInbox(); views.badge(); },
  async cargarHoy() {
    [this.estado, this.movsMes, this.recientes, this.metasP] = await Promise.all([
      api.getEstado(), api.listMovsMes(fmt.mes()), api.listRecientes(5), api.listMetasProgreso(),
    ]);
    views.lateralEstado();
  },
  async cargarMovs() { this.movimientos = await api.listMovimientos(this.filtros); },
  async cargarMes() {
    const mes = fmt.mes();
    [this.estado, this.saldos, this.metasP, this.presupuestos, this.movsMes] = await Promise.all([
      api.getEstado(), api.listSaldos(), api.listMetasProgreso(),
      api.listPresupuestos(mes), api.listMovsMes(mes),
    ]);
    // SPEC §5: first run of a new month copies last month's limits forward
    if (this.presupuestos.length === 0) {
      const prev = await api.listPresupuestos(fmt.mesAnterior());
      if (prev.length) {
        this.presupuestos = await api.addPresupuestos(
          prev.map(p => ({ mes, categoria_id: p.categoria_id, limite: p.limite })));
        this.notaCopiado = `Límites copiados de ${fmt.nombreMes(fmt.mesAnterior())}.`;
      }
    }
    views.lateralEstado();
  },
  async cargarPresupuestos() {
    this.presEdit = {};
    [this.presupuestos, this.gastoMensual] = await Promise.all([
      api.listPresupuestos(fmt.mes()), api.listGastoMensual(),
    ]);
  },
  async cargarCandado() {
    [this.estado, this.semanaMetas, this.semanaRegistro] = await Promise.all([
      api.getEstado(), api.listSemanaMetas(), api.listSemanaRegistro(),
    ]);
    views.lateralEstado();
  },

  cat(id) { return this.categorias.find(c => c.id === id); },
  cuenta(id) { return this.cuentas.find(c => c.id === id); },
  catPorNombre(n) { return this.categorias.find(c => c.nombre === n); },
  catsGasto() { return this.categorias.filter(c => c.nombre !== 'Ingreso'); },
  /* times a checklist goal was done in a given ISO week */
  veces(metaId, semana) {
    return this.semanaRegistro.find(r => r.semana_meta_id === metaId && r.semana === semana)?.veces ?? 0;
  },
  /* fraction of the checklist fulfilled in a week (each goal capped at 100%) */
  cumplimiento(semana) {
    if (!this.semanaMetas.length) return null;
    const suma = this.semanaMetas.reduce(
      (a, m) => a + Math.min(this.veces(m.id, semana) / m.veces_objetivo, 1), 0);
    return suma / this.semanaMetas.length;
  },
};

/* ============ helpers ============ */
const $ = sel => document.querySelector(sel);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const esMac = () => window.matchMedia('(min-width: 860px)').matches;
const barra = (pct, clase = '') =>
  `<div class="bar ${clase}"><i style="width:${Math.max(0, Math.min(pct, 100))}%"></i></div>`;

/* ============ views: one render per screen; they only draw the store ============ */
const views = {
  badge() {
    const b = $('#inbox-badge');
    b.hidden = store.inbox.length === 0;
    b.textContent = store.inbox.length;
  },

  lateralEstado() {
    const e = store.estado;
    if (!e) return;
    const abierto = e.candado === 'abierto';
    $('#lateral-estado').innerHTML =
      `<span class="dot ${abierto ? 'open' : 'closed'}"></span>Candado ${abierto ? 'abierto' : 'cerrado'} esta semana`;
    document.querySelectorAll('[data-icon="candado-abierto"]').forEach(el => {
      el.innerHTML = icon(abierto ? 'candado-abierto' : 'candado-cerrado');
    });
  },

  /* one ledger row */
  filaMov(m, { conIcono = true } = {}) {
    const cat = m.categorias;
    const titulo = m.comercio || m.nota || (cat ? cat.nombre : 'Sin descripción');
    const partes = [cat?.nombre, m.cuentas?.nombre, fmt.fecha(m.fecha)].filter(Boolean);
    const ingreso = Number(m.monto) > 0;
    const cerrado = store.estado?.candado === 'cerrado' && cat?.discrecional && m.tipo === 'gasto';
    return `
      <div class="fila" data-id="${m.id}">
        ${conIcono ? `<span class="ico-cat">${icon(cat ? cat.icono : 'help')}</span>` : ''}
        <div class="quien">
          <div class="titulo">${esc(titulo)}</div>
          <div class="sub">${esc(partes.join(' · '))}</div>
          ${cerrado ? '<div class="aviso">Discrecional · candado cerrado</div>' : ''}
        </div>
        ${fmt.money(m.monto, { signo: true, clase: ingreso ? 'in' : '' })}
      </div>`;
  },

  /* ---- Hoy (phone home) ---- */
  hoy() {
    const e = store.estado || {};
    const abierto = e.candado !== 'cerrado';
    const limite = Number(e.discrecional_limite) || 0;
    const gastado = Number(e.discrecional_gastado) || 0;
    const restante = Number(e.discrecional_restante) || 0;
    const pasada = store.cumplimiento(fmt.semanaHace(1));
    const detalle = store.semanaMetas.length
      ? store.semanaMetas.map(m => `${store.veces(m.id, fmt.semanaHace(1))}/${m.veces_objetivo} ${m.nombre.toLowerCase()}`).join(', ')
      : 'Sin lista semanal todavía';

    const hoyISO = fmt.hoy();

        <div><span class="lbl">Gastado</span>${fmt.money(gastadoMes)}
          <span class="tn b3" style="font-size:12px">${totalLimites ? Math.round(gastadoMes / totalLimites * 100) : 0} % del total</span></div>
      </div>

      <table>
        <thead><tr><th>Categoría</th>
          ${meses3.map(x => `<th class="r">${esc(fmt.nombreMes(x).slice(0, 3))}</th>`).join('')}

                 style="text-align:right;max-width:110px" value="${val === '' ? '' : esc(String(val))}" placeholder="—"></td>
            <td class="r tn">${gasto(c.id, mes) ? fmt.mxn(gasto(c.id, mes)).replace(/^\$/, '').replace(/\.00$/, '') : '—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>

  /* ---- quick add sheet ---- */
  hoja() {
    const t = store.add.tipo;
    document.querySelectorAll('.tabs-hoja button').forEach(b => b.classList.toggle('on', b.dataset.tipo === t));
    $('#hoja-lbl-cat').textContent = t === 'ahorro' ? 'Meta' : 'Categoría';
    $('#hoja-nota').parentElement.hidden = t === 'ahorro';

    let opciones;
    if (t === 'ahorro') {
      opciones = store.metasP.map(m => ({ id: m.id, nombre: m.nombre, sel: store.add.meta_id === m.id }));
      if (!opciones.some(o => o.sel) && opciones.length) { store.add.meta_id = opciones[0].id; opciones[0].sel = true; }
    } else {
      const cats = t === 'ingreso'
        ? store.categorias.filter(c => c.nombre === 'Ingreso')
        : store.catsGasto();
      if (!cats.some(c => c.id === store.add.categoria_id)) store.add.categoria_id = cats[0]?.id ?? null;
      opciones = cats.map(c => ({ id: c.id, nombre: c.nombre, disc: c.discrecional, sel: c.id === store.add.categoria_id }));
    }
    $('#hoja-cats').innerHTML = opciones.length
      ? opciones.map(o => `<button type="button" class="chip ${o.sel ? 'on' : ''}" data-op="${o.id}">${esc(o.nombre)}${o.disc ? DISC : ''}</button>`).join('')
      : '<p class="b3" style="grid-column:1/-1;margin:0;font-size:13px">Crea una meta primero en Mes.</p>';

      <button type="button" class="chip sm ${c.id === store.add.cuenta_id ? 'on' : ''}" data-cuenta="${c.id}">${esc(c.nombre)}</button>`).join('');

  toast(texto, accion) {
    const el = $('#toast');
    $('#toast-texto').textContent = texto;
    const btn = $('#toast-accion');
    btn.hidden = !accion;
    btn.textContent = accion?.texto ?? '';
    btn.onclick = accion?.fn ?? null;
    el.hidden = false;
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => { el.hidden = true; }, 6000);
  },
};

/* ============ router: hash navigation ============ */
const router = {
  rutas: {
    hoy:           { pantalla: 'pantalla-hoy',           async entrar() { await Promise.all([store.cargarHoy(), store.cargarCandado()]); views.hoy(); } },
    inbox:         { pantalla: 'pantalla-inbox',         async entrar() { await store.cargarInbox(); views.inbox(); } },
    mes:           { pantalla: 'pantalla-mes',           async entrar() { await store.cargarMes(); views.mes(); } },
    mas:           { pantalla: 'pantalla-mas',           async entrar() { views.mas(); } },
    candado:       { pantalla: 'pantalla-candado',       async entrar() { await store.cargarCandado(); views.candado(); } },
    resumen:       { pantalla: 'pantalla-resumen',       async entrar() { await store.cargarMes(); views.resumen(); } },
    movimientos:   { pantalla: 'pantalla-movimientos',   async entrar() { await store.cargarMovs(); views.movimientos(); } },
    presupuestos:  { pantalla: 'pantalla-presupuestos',  async entrar() { await store.cargarPresupuestos(); views.presupuestos(); } },
  },
  actual: null,

  async ir() {
    const nombre = location.hash.replace('#/', '') in this.rutas ? location.hash.replace('#/', '') : (esMac() ? 'resumen' : 'hoy');
    this.actual = nombre;
    for (const [n, r] of Object.entries(this.rutas)) {
      document.getElementById(r.pantalla).hidden = n !== nombre;
    }
    document.querySelectorAll('[data-ruta]').forEach(a => a.classList.toggle('on', a.dataset.ruta === nombre));
    try { await this.rutas[nombre].entrar(); }
    catch (e) { views.toast(e.message); }
  },
};

    const mov = {

    };

/* ============ inbox: categorize inside the card, with undo ============ */
$('#pantalla-inbox').addEventListener('click', async e => {
  const tarjeta = e.target.closest('[data-mov]');
  if (!tarjeta) return;
  const mov = store.inbox.find(m => m.id === tarjeta.dataset.mov);
  if (!mov) return;

  const cuenta = e.target.closest('[data-cuenta]');
  if (cuenta) {
    try {
      await api.actualizarMovimiento(mov.id, { cuenta_id: cuenta.dataset.cuenta });
      mov.cuenta_id = cuenta.dataset.cuenta;
      views.inbox();
    } catch (err) { views.toast(err.message); }
    return;
  }

  const chip = e.target.closest('[data-cat]');
  if (chip) {
    const cat = store.cat(chip.dataset.cat);
    try {
      await api.actualizarMovimiento(mov.id, { categoria_id: cat.id });
      views.toast(`${mov.comercio || mov.nota || 'Movimiento'} → ${cat.nombre}`, {
        texto: 'Deshacer',
        fn: async () => {
          await api.actualizarMovimiento(mov.id, { categoria_id: null });
          $('#toast').hidden = true;
          await store.cargarInbox();
          views.inbox();
        },
      });
      await store.cargarInbox();
      views.inbox();
    } catch (err) { views.toast(err.message); }
    return;
  }

  if (store.inboxAbierto !== mov.id) { store.inboxAbierto = mov.id; views.inbox(); }
});

function fijarLimite(catId) {
  const cat = store.cat(catId);
  const actual = store.presupuestos.find(p => p.categoria_id === catId);
  hojaInput.abrir({
    titulo: `Límite mensual · ${cat.nombre}`,
    etiquetaMonto: 'Límite',
    monto: actual ? String(Number(actual.limite)) : '',
    async onGuardar({ monto }) {
      if (!(monto > 0)) throw new Error('Escribe un monto válido.');
      await api.upsertPresupuesto(fmt.mes(), catId, monto);
    },
  });
}

function ajustarCuenta(cuentaId) {
  const cu = store.saldos.find(s => s.id === cuentaId);
  hojaInput.abrir({
    titulo: `Saldo real de ${cu.nombre}`,
    etiquetaMonto: 'Saldo real',
    async onGuardar({ monto }) {
      if (isNaN(monto)) throw new Error('Escribe el saldo real.');
      const dif = Math.round((monto - Number(cu.saldo)) * 100) / 100;
      if (dif === 0) return;
      await api.addMovimiento({
        fecha: fmt.hoy(), monto: dif, cuenta_id: cu.id,
        nota: 'Ajuste de saldo', origen: 'app', tipo: 'ajuste',
      });
    },
  });
}

function nuevaMeta() {
  hojaInput.abrir({
    titulo: 'Nueva meta',
    conNombre: true,
    etiquetaMonto: 'Objetivo',
    async onGuardar({ monto, nombre }) {
      if (!nombre) throw new Error('Ponle un nombre a la meta.');
      if (!(monto > 0)) throw new Error('Escribe el objetivo en pesos.');
      await api.addMeta(nombre, monto);
    },
  });
}

function exportarCSV() {
  const filas = [['fecha', 'comercio', 'nota', 'categoria', 'cuenta', 'monto', 'tipo', 'origen']];
  (store.movimientos.length ? store.movimientos : []).forEach(m => filas.push([
    m.fecha, m.comercio ?? '', m.nota ?? '', m.categorias?.nombre ?? '',
    m.cuentas?.nombre ?? '', Number(m.monto).toFixed(2), m.tipo, m.origen,
  ]));
  const csv = filas.map(f => f.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `serge-finance-${store.filtros.mes || fmt.mes()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  if (!store.movimientos.length) await store.cargarMovs();

$('#pantalla-presupuestos').addEventListener('input', e => {

  const v = parseFloat(inp.value.replace(/[$,\s]/g, ''));
  const actual = store.presupuestos.find(p => p.categoria_id === inp.dataset.pres);

  else if (Number(actual?.limite) === v) delete store.presEdit[inp.dataset.pres];
  else store.presEdit[inp.dataset.pres] = v;
  const n = Object.keys(store.presEdit).length;
  $('#btn-guardar-pres').disabled = n === 0;
});

      await store.cargarPresupuestos();
      views.presupuestos();
    } catch (err) { views.toast(err.message); btn.disabled = false; }
    return;
  }
  if (e.target.closest('#btn-copiar-mes')) {
    try {
      const prev = await api.listPresupuestos(fmt.mesAnterior());
      if (!prev.length) { views.toast('No hay límites del mes anterior.'); return; }
      for (const p of prev) await api.upsertPresupuesto(fmt.mes(), p.categoria_id, p.limite);
      views.toast(`Copiados de ${fmt.nombreMes(fmt.mesAnterior())}`);
      await store.cargarPresupuestos();
      views.presupuestos();
    } catch (err) { views.toast(err.message); }
  }
});

/* --- boot --- */
document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
window.matchMedia('(min-width: 860px)').addEventListener('change', () => router.ir());
api.loadSession();
if (api.session) {
  iniciarApp().catch(() => { api.signOut(); mostrarLogin(); });
} else {
  mostrarLogin();
}
</script>
</body>
</html>
